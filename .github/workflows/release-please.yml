on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
      pr_head_ref: ${{ steps.release.outputs.pr_head_ref }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.HPCACCESS_RELEASE_PLEASE_TOKEN }}

  # Let hpc-access-cli pin the new release and regenerate its API models
  update-cli-pin:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the hpc-access update in hpc-access-cli
        env:
          GH_TOKEN: ${{ secrets.HPCACCESS_RELEASE_PLEASE_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run update-hpc-access.yml --repo bihealth/hpc-access-cli --field ref="$TAG"
